[package]
name = "docs-clone"
version = "0.5.0"
edition = "2021"

[dependencies]
actix-web = "4.4"
actix-files = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mongodb = { version = "3", default-features = false, features = ["rustls-tls", "dns-resolver", "compat-3-0-0"] }
tokio = { version = "1.35", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
env_logger = "0.11"
actix-multipart = "0.6"
futures = "0.3"
tera = "1.19"
ammonia = "4.1.4"
actix-governor = "0.10.0"
once_cell = "1.21.4"
bson = { version = "2", features = ["chrono-0_4"] }

[dev-dependencies]
actix-rt = "2.9"
